map $upstream_http_content_security_policy $islands_module_csp {
    default $upstream_http_content_security_policy;
    "" "default-src 'none'; frame-ancestors 'none'; base-uri 'none'";
}

server {
    listen 80;
    server_name catalog.example;
    return 400;
}

server {
    listen 443 ssl;
    server_name catalog.example;
    ssl_certificate /etc/islands/tls/catalog.crt;
    ssl_certificate_key /etc/islands/tls/catalog.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /var/log/nginx/islands-errors.log crit;
    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 5s;
    keepalive_timeout 5s;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;
    proxy_next_upstream off;
    proxy_cache off;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Powered-By;
    add_header Content-Security-Policy $islands_module_csp always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    proxy_set_header Host $host;
    proxy_set_header Cookie "";
    proxy_set_header X-Forwarded-For "";

    location ~ ^/releases/[a-zA-Z0-9][a-zA-Z0-9_-]*/assets/[a-zA-Z0-9_./-]+$ {
        limit_except GET { deny all; }
        proxy_set_header Host $host;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-For "";
        proxy_pass http://127.0.0.1:4101;
    }

    location ~ ^/(healthz|readyz|releases/[a-zA-Z0-9][a-zA-Z0-9_-]*/(manifest\.json|render|readyz))$ {
        allow 192.0.2.10;
        deny all;
        proxy_set_header Host $host;
        proxy_set_header Cookie "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-For "";
        proxy_pass http://127.0.0.1:4101;
    }

    location / { return 404; }
}
