map $upstream_http_content_security_policy $islands_host_csp {
    default $upstream_http_content_security_policy;
    "" "default-src 'none'; frame-ancestors 'none'; base-uri 'none'";
}

server {
    listen 80;
    server_name shop.example;
    return 308 https://shop.example$request_uri;
}

server {
    listen 443 ssl;
    server_name shop.example;
    ssl_certificate /etc/islands/tls/shop.crt;
    ssl_certificate_key /etc/islands/tls/shop.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /var/log/nginx/islands-errors.log crit;
    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 5s;
    keepalive_timeout 5s;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;
    proxy_next_upstream off;
    proxy_cache off;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Powered-By;
    add_header Content-Security-Policy $islands_host_csp always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For "";
        proxy_pass http://127.0.0.1:4100;
    }
}
